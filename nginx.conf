# پیکربندی Nginx برای آکادمی پارادایس (Paradise Academy)
# مسیر قرارگیری معمول: /etc/nginx/sites-available/paradise-academy.conf

server {
    listen 80;
    server_name yourdomain.com www.yourdomain.com; # دامنه خود را اینجا وارد کنید

    # هدایت خودکار به HTTPS (پس از نصب گواهی SSL)
    # return 301 https://$host$request_uri;

    client_max_body_size 25M;

    # فشرده‌سازی Gzip برای افزایش سرعت لود سایت
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # کش کردن فایل‌های استاتیک بیلد شده
    location /assets/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ارجاع درخواست‌ها و API به سرور Node.js
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
